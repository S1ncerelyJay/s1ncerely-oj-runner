name: Package extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Test macOS bits compatibility
        run: |
          c++ -std=c++17 -I resources/include test/bits-compatibility.cpp -o /tmp/bits-compatibility
          /tmp/bits-compatibility
      - name: Package VSIX
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: s1ncerely-oj-runner-vsix
          path: "*.vsix"
